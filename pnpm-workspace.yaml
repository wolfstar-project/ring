overrides:
  ansi-regex: ^6.2.2
  minimist: ^1.2.8
  "@wolfstar/http-framework": ^6.2.2
  "@wolfstar/plugin-i18next": 2.2.0

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true

dedupePeers: true

shellEmulator: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - "@eslint-community/eslint-plugin-eslint-comments@4.7.2"
  - "@wolfstar/cli@2.6.0"
  - "@wolfstar/env-utilities@2.3.1"
  - "@wolfstar/http-framework@6.2.2"
  - "@wolfstar/i18next-type-generator@3.1.6"
  - "@wolfstar/kit@0.2.0"
  - "@wolfstar/nitro-server@0.2.9"
  - "@wolfstar/schema@0.9.0"
  - "@wolfstar/shared-http-pieces@2.0.2"
  - "@wolfstar/start-banner@2.1.3"
  - "@wolfstar/vite-server@0.4.4"

shamefullyHoist: true

hoistPattern:
  - "*prisma*"

ignoreWorkspaceRootCheck: true
